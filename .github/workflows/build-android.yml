name: Build and verify Android wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_emulator_tests:
        description: Run cibuildwheel import smoke tests in managed Android emulators
        required: true
        type: boolean
        default: false
      build_opencv:
        description: Build optional OpenCV-Python Android wheels from pinned upstream source
        required: true
        type: boolean
        default: true
      restage_from_build_run_id:
        description: Re-stage previously verified wheel artifacts after recipe or SBOM review, without rebuilding
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Repository tooling tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Install pinned tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run repository validation tests
        run: python -m unittest discover -s tests -v

  build:
    name: CPython 3.13 · ${{ matrix.abi }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.restage_from_build_run_id == '' }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            abi: x86_64
            cibw_arch: x86_64
            emulator_test: false
          - runner: macos-15
            abi: arm64_v8a
            cibw_arch: arm64_v8a
            emulator_test: false
    runs-on: ${{ matrix.runner }}
    env:
      ANDROID_API_LEVEL: "25"
      CIBW_BUILD: cp313-android_*

    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Set up pinned Java runtime
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Android emulator on supported Linux CI runner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator_tests == true && matrix.abi == 'x86_64' }}
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "emulator"

      - name: Preserve NDK ELF tools before cibuildwheel cleanup
        shell: bash
        run: |
          prebuilt="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"
          test -d "$prebuilt"
          mkdir -p "$RUNNER_TEMP/pyrun-llvm-prebuilt"
          cp -R "$prebuilt/." "$RUNNER_TEMP/pyrun-llvm-prebuilt/"
          readelf="$(find "$RUNNER_TEMP/pyrun-llvm-prebuilt" -name llvm-readelf -print -quit)"
          if [[ -z "$readelf" || ! -x "$readelf" ]]; then
            echo "Could not preserve executable NDK llvm-readelf"
            find "$RUNNER_TEMP/pyrun-llvm-prebuilt" -name llvm-readelf -print
            exit 1
          fi
          echo "PYRUN_NDK_LLVM_READELF=$readelf" >> "$GITHUB_ENV"

      - name: Install pinned wheel tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Skip emulator when this runner cannot provide managed Android virtualization
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_emulator_tests != true || matrix.abi != 'x86_64' }}
        shell: bash
        run: |
          echo "CIBW_TEST_SKIP=*" >> "$GITHUB_ENV"
          echo "Skipping Android emulator tests: not explicitly enabled for this supported Linux x86_64 job."

      - name: Build the ABI wheel twice
        shell: bash
        run: |
          python -m cibuildwheel --platform android \
            --archs "${{ matrix.cibw_arch }}" \
            --output-dir wheelhouse-first recipes/native_probe
          python -m cibuildwheel --platform android \
            --archs "${{ matrix.cibw_arch }}" \
            --output-dir wheelhouse-repeat recipes/native_probe

      - name: Verify repeat-build reproducibility
        run: python scripts/compare_wheels.py wheelhouse-first wheelhouse-repeat

      - name: Verify wheel tags, ABI, hashes, and 16 KB ELF alignment
        shell: bash
        run: |
          python scripts/verify_android_wheels.py wheelhouse-first/*.whl \
            --expected-abi "${{ matrix.abi }}" --android-api 25 --readelf "$PYRUN_NDK_LLVM_READELF"

      - name: Prepare pinned upstream OpenCV-Python source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_opencv == true }}
        shell: bash
        run: |
          python scripts/prepare_opencv_source.py --source-dir "$RUNNER_TEMP/opencv-python-source"

      - name: Build optional OpenCV-Python Android wheel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_opencv == true }}
        shell: bash
        run: |
          export CIBW_TEST_SKIP='*'
          export CIBW_ENVIRONMENT_ANDROID='PIP_EXTRA_INDEX_URL=https://chaquo.com/pypi-13.1/ ENABLE_HEADLESS=1'
          python -m cibuildwheel --platform android \
            --archs "${{ matrix.cibw_arch }}" \
            --output-dir opencv-wheelhouse "$RUNNER_TEMP/opencv-python-source"

      - name: Verify OpenCV wheel tags, ABI, hashes, and 16 KB ELF alignment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_opencv == true }}
        shell: bash
        run: |
          python scripts/verify_android_wheels.py opencv-wheelhouse/*.whl \
            --expected-abi "${{ matrix.abi }}" --android-api 25 --readelf "$PYRUN_NDK_LLVM_READELF"

      - name: Upload verified wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.abi }}
          path: wheelhouse-first/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload optional OpenCV wheel for reviewed snapshot staging
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_opencv == true }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-opencv-${{ matrix.abi }}
          path: opencv-wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  stage-index:
    name: Stage unsigned, unpublished Simple Repository
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.restage_from_build_run_id == '' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Set up pinned Java runtime
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download wheels from both ABI jobs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install pinned repository tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Re-verify both ABI artifacts and stage snapshot
        shell: bash
        run: |
          readelf="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf -print -quit)"
          if [[ -z "$readelf" || ! -x "$readelf" ]]; then
            echo "NDK llvm-readelf was not found or is not executable: $ANDROID_NDK_HOME"
            find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf -print
            exit 1
          fi
          python scripts/verify_android_wheels.py wheelhouse/*.whl \
            --android-api 25 --readelf "$readelf"
          python scripts/stage_simple_index.py \
            --wheel-dir wheelhouse \
            --output-dir dist/repository \
            --source-revision "$GITHUB_SHA"

      - name: Upload unsigned snapshot for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simple-repository-snapshot
          path: dist/repository
          if-no-files-found: error
          retention-days: 14

  restage-index:
    name: Re-stage reviewed wheel artifacts without rebuilding
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.restage_from_build_run_id != '' }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BUILD_RUN_ID: ${{ inputs.restage_from_build_run_id }}
    steps:
      - name: Check out reviewed repository metadata
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Set up pinned Java runtime
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate successful source build run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_BUILD_RUN_ID" =~ ^[0-9]{1,20}$ ]] || {
            echo "restage_from_build_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          }
          metadata="$(gh run view "$SOURCE_BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,event,status,conclusion,headSha)"
          printf '%s' "$metadata" | jq -e '
            .workflowName == "Build and verify Android wheels" and
            .headBranch == "main" and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and
            .conclusion == "success" and
            (.headSha | test("^[0-9a-f]{40}$"))
          ' >/dev/null || {
            echo "The source run must be a successful Android wheel build on main" >&2
            exit 1
          }
          echo "SOURCE_BUILD_SHA=$(printf '%s' "$metadata" | jq -r '.headSha')" >> "$GITHUB_ENV"

      - name: Download exact wheel artifacts from the source build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded-wheels wheelhouse
          gh run download "$SOURCE_BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'wheels-*' --dir downloaded-wheels
          find downloaded-wheels -type f -name '*.whl' -exec cp -n {} wheelhouse/ \;
          test "$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 4
          for abi in arm64_v8a x86_64; do
            test -f "wheelhouse/pyrun_native_probe-0.1.0-cp313-cp313-android_25_"$abi".whl"
            test -f "wheelhouse/opencv_python_headless-4.11.0.86-cp313-cp313-android_25_"$abi".whl"
          done

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install pinned repository tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Re-verify wheel artifacts and stage reviewed snapshot
        shell: bash
        run: |
          set -euo pipefail
          readelf="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf -print -quit)"
          test -n "$readelf" && test -x "$readelf"
          for abi in arm64_v8a x86_64; do
            for wheel in wheelhouse/*android_25_"$abi".whl; do
              python scripts/verify_android_wheels.py "$wheel" \
                --expected-abi "$abi" --android-api 25 --readelf "$readelf"
            done
          done
          python scripts/stage_simple_index.py \
            --wheel-dir wheelhouse \
            --output-dir dist/repository \
            --source-revision "$SOURCE_BUILD_SHA"

      - name: Upload unsigned snapshot for signing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simple-repository-snapshot
          path: dist/repository
          if-no-files-found: error
          retention-days: 14
