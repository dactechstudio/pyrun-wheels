name: Build and verify Android wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CPython 3.13 · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            abi: x86_64
            cibw_arch: x86_64
          - os: macos-15
            abi: arm64_v8a
            cibw_arch: arm64_v8a
    runs-on: ${{ matrix.os }}
    env:
      ANDROID_API_LEVEL: "25"
      CIBW_BUILD: cp313-android_*
      CIBW_BUILD_FRONTEND: build

    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install pinned wheel tooling
        run: python -m pip install --disable-pip-version-check cibuildwheel==4.3.1 packaging==25.0

      - name: Build and run Android import smoke test
        run: >-
          python -m cibuildwheel --platform android
          --archs "${{ matrix.cibw_arch }}"
          --output-dir wheelhouse recipes/native_probe

      - name: Verify wheel tags, ABI, hashes, and 16 KB ELF alignment
        shell: bash
        run: |
          readelf="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -type f -name llvm-readelf -print -quit)"
          test -n "$readelf"
          python scripts/verify_android_wheels.py wheelhouse/*.whl \
            --expected-abi "${{ matrix.abi }}" --android-api 25 --readelf "$readelf"

      - name: Upload verified wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  stage-index:
    name: Build Simple Repository snapshot
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Download wheels from both ABI jobs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install pinned index tooling
        run: python -m pip install --disable-pip-version-check packaging==25.0 jsonschema==4.25.1

      - name: Re-verify both ABI artifacts and stage index
        shell: bash
        run: |
          readelf="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -type f -name llvm-readelf -print -quit)"
          test -n "$readelf"
          python scripts/verify_android_wheels.py wheelhouse/*.whl \
            --android-api 25 --readelf "$readelf"
          python scripts/stage_simple_index.py \
            --wheel-dir wheelhouse \
            --output-dir dist/repository \
            --source-revision "$GITHUB_SHA"

      - name: Upload unpublished, unsigned repository snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: simple-repository-snapshot
          path: dist/repository
          if-no-files-found: error
          retention-days: 14
