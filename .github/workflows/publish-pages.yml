name: Publish signed wheel snapshot to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      signing_workflow_run_id:
        description: Successful Sign and promote wheel snapshot run ID from main
        required: true
        type: string
      release_id:
        description: Exact immutable release ID used by the signing workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pyrun-wheel-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SIGNING_RUN_ID: ${{ inputs.signing_workflow_run_id }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Check out release policy and verification key
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Install pinned repository tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Configure GitHub credentials for state-branch pushes
        run: gh auth setup-git

      - name: Validate the signed workflow run and release ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SIGNING_RUN_ID" =~ ^[0-9]{1,20}$ ]] || {
            echo "signing_workflow_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          }
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ && "$RELEASE_ID" != *..* ]] || {
            echo "release_id must be 1-64 safe characters and cannot contain '..'" >&2
            exit 1
          }
          metadata="$(gh run view "$SOURCE_SIGNING_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,event,status,conclusion)"
          printf '%s' "$metadata" | jq -e '
            .workflowName == "Sign and promote wheel snapshot" and
            .headBranch == "main" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success"
          ' >/dev/null || {
            echo "The source must be a successful signed-snapshot run dispatched from main" >&2
            exit 1
          }
          test -s keys/pyrun-ed25519-public.pem || {
            echo "The committed Ed25519 public verification key is missing" >&2
            exit 1
          }

      - name: Download the exact signed snapshot artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/incoming
          gh run download "$SOURCE_SIGNING_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "signed-wheel-snapshot-$RELEASE_ID" --dir dist/incoming

      - name: Verify signature, manifest, and every snapshot digest
        run: |
          python scripts/sign_manifest.py verify dist/incoming/manifest.json \
            --public-key keys/pyrun-ed25519-public.pem \
            --signature dist/incoming/manifest.json.sig

      - name: Add release to the immutable Pages site history
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/pyrun-pages-state"
          case "$state_dir" in
            "$RUNNER_TEMP"/pyrun-pages-state) ;;
            *) echo "Unexpected Pages state path" >&2; exit 1 ;;
          esac
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --no-tags origin gh-pages
            git worktree add --detach "$state_dir" FETCH_HEAD
          else
            empty_tree="$(git hash-object -t tree -w --stdin </dev/null)"
            initial_commit="$(printf 'Initialize PyRun wheel Pages history\n' | \
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit-tree "$empty_tree")"
            git branch gh-pages "$initial_commit"
            git worktree add "$state_dir" gh-pages
          fi
          python scripts/prepare_pages_site.py \
            --snapshot dist/incoming \
            --site-dir "$state_dir" \
            --release-id "$RELEASE_ID" \
            --public-key keys/pyrun-ed25519-public.pem
          git -C "$state_dir" config user.name "github-actions[bot]"
          git -C "$state_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$state_dir" add --all
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m "Publish signed wheel snapshot $RELEASE_ID"
            git -C "$state_dir" push origin HEAD:gh-pages
          fi
          mkdir -p dist/pages-site
          rsync -a --exclude=.git "$state_dir/" dist/pages-site/

      - name: Upload the cumulative static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
