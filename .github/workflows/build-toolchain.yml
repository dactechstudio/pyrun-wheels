name: Build and prove signed Android compiler packs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable compiler-pack version (for example termux-2026.10.25)
        required: true
        type: string
        default: termux-2026.10.25
      run_android_proof:
        description: Boot managed Android emulators and compile C, C++, and Fortran
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build compiler pack · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64_v8a, x86_64]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pack builder
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Build from the pinned public Termux package index
        run: |
          mkdir -p dist
          python scripts/build_android_toolchain_pack.py \
            --abi "${{ matrix.abi }}" \
            --version "${{ inputs.version }}" \
            --output "dist/pyrun-toolchain-${{ matrix.abi }}-${{ inputs.version }}.tar.xz" \
            --cache-dir "$RUNNER_TEMP/pyrun-termux-cache"

      - name: Upload unsigned pack for proof and protected signing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compiler-pack-${{ matrix.abi }}
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 14

  android-proof:
    name: Android compiler proof · ${{ matrix.abi }}
    if: ${{ inputs.run_android_proof == true }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64_v8a
            system_image: system-images;android-35;google_apis;arm64-v8a
            emulator_abi: arm64-v8a
            emulator_accel: off
          - abi: x86_64
            system_image: system-images;android-35;google_apis;x86_64
            emulator_abi: x86_64
            emulator_accel: auto
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proof scripts
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Download unsigned compiler pack
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: compiler-pack-${{ matrix.abi }}
          path: dist

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          set +e
          yes | "$sdkmanager" --licenses >/dev/null
          sdk_status="${PIPESTATUS[1]}"
          set -e
          test "$sdk_status" -eq 0
          "$sdkmanager" --install "platform-tools" "emulator" "${{ matrix.system_image }}"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"
          echo "no" | "$avdmanager" create avd --force --name pyrun-${{ matrix.abi }} --package "${{ matrix.system_image }}" --device pixel_2

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          emulator="${ANDROID_HOME}/emulator/emulator"
          adb start-server >/dev/null
          "$emulator" -avd pyrun-${{ matrix.abi }} -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel "${{ matrix.emulator_accel }}" >"$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/emulator.pid"
          device_ready=false
          for attempt in $(seq 1 120); do
            if timeout 10s adb wait-for-device >/dev/null 2>&1; then
              device_ready=true
              booted="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              [ "$booted" = "1" ] && break
            fi
            sleep 2
          done
          if [ "$device_ready" != true ] || [ "$(timeout 10s adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            cat "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Extract and push pack without host-only symlinks
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -name '*.tar.xz' -print -quit)"
          mkdir -p "$RUNNER_TEMP/pyrun-pack" "$RUNNER_TEMP/pyrun-pack-flat"
          tar -xJf "$archive" -C "$RUNNER_TEMP/pyrun-pack"
          cp -aL "$RUNNER_TEMP/pyrun-pack/." "$RUNNER_TEMP/pyrun-pack-flat/"
          adb shell 'rm -rf /data/local/tmp/pyrun-toolchain && mkdir -p /data/local/tmp/pyrun-toolchain'
          adb push "$RUNNER_TEMP/pyrun-pack-flat/." /data/local/tmp/pyrun-toolchain/ >/dev/null
          adb shell 'chmod -R 755 /data/local/tmp/pyrun-toolchain/bin'

      - name: Compile and execute C, C++, and Fortran proofs on Android
        shell: bash
        run: |
          set -euo pipefail
          adb shell 'cd /data/local/tmp/pyrun-toolchain && export PYRUN_TOOLCHAIN_ROOT=/data/local/tmp/pyrun-toolchain && export PATH="$PYRUN_TOOLCHAIN_ROOT/bin:$PATH" && export LD_LIBRARY_PATH="$PYRUN_TOOLCHAIN_ROOT/lib:$LD_LIBRARY_PATH" && clang proof/hello.c -o proof/hello-c && clang++ proof/hello.cpp -o proof/hello-cpp && flang proof/hello.f90 -o proof/hello-fortran && ./proof/hello-c && ./proof/hello-cpp && ./proof/hello-fortran' | tee "$RUNNER_TEMP/android-toolchain-proof.txt"
          grep -q 'pyrun-c-ok' "$RUNNER_TEMP/android-toolchain-proof.txt"
          grep -q 'pyrun-cpp-ok' "$RUNNER_TEMP/android-toolchain-proof.txt"
          grep -q 'pyrun-fortran-ok' "$RUNNER_TEMP/android-toolchain-proof.txt"

      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true

  sign:
    name: Sign verified compiler packs
    if: ${{ inputs.run_android_proof == true }}
    needs: [build, android-proof]
    runs-on: ubuntu-24.04
    environment:
      name: wheel-release
    permissions:
      actions: read
      contents: read
    env:
      PYRUN_ED25519_PRIVATE_KEY: ${{ secrets.PYRUN_ED25519_PRIVATE_KEY }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up CPython
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.17"

      - name: Download both proved packs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: compiler-pack-*
          path: incoming
          merge-multiple: true

      - name: Sign and verify each exact pack manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PYRUN_ED25519_PRIVATE_KEY"
          mkdir -p signed
          for archive in incoming/*.tar.xz; do
            abi="$(basename "$archive" | sed -E 's/^pyrun-toolchain-([^-]+)-.*$/\1/')"
            root="$RUNNER_TEMP/signed-$abi"
            mkdir -p "$root"
            tar -xJf "$archive" -C "$root"
            python scripts/sign_toolchain_manifest.py sign "$root/manifest.json" --private-key-env PYRUN_ED25519_PRIVATE_KEY
            python scripts/sign_toolchain_manifest.py verify "$root/manifest.json" --public-key keys/pyrun-ed25519-public.pem --signature "$root/manifest.json.sig"
            signed_archive="$GITHUB_WORKSPACE/signed/pyrun-toolchain-$abi-${{ inputs.version }}.tar.xz"
            (cd "$root" && tar -cJf "$signed_archive" -- *)
          done

      - name: Upload signed packs for reviewed Pages publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-compiler-packs-${{ inputs.version }}
          path: signed/*.tar.xz
          if-no-files-found: error
          retention-days: 90
